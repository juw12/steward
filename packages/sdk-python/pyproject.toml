[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "steward"
version = "0.1.0"
description = "Steward SDK - governance layer for embedded AI"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "jsonschema>=4.0",
]

[tool.setuptools.packages.find]
include = ["steward*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
